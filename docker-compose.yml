services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://study_runtime:study-runtime-local@db:5432/study
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?Set ADMIN_SERVICE_TOKEN}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:?Set TELEGRAM_BOT_ID}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:?Set TELEGRAM_USER_ID}
      TELEGRAM_PRIVATE_CHAT_ID: ${TELEGRAM_PRIVATE_CHAT_ID:?Set TELEGRAM_PRIVATE_CHAT_ID}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uv", "run", "python", "-m", "app.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres-local-only@db:5432/study
      RUNTIME_DATABASE_ROLE: study_runtime
    depends_on:
      db:
        condition: service_healthy
  planning-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uv", "run", "python", "-m", "app.planning"]
    environment:
      DATABASE_URL: postgresql://study_runtime:study-runtime-local@db:5432/study
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FREE_TIER_ACKNOWLEDGED: ${GEMINI_FREE_TIER_ACKNOWLEDGED:-false}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-8192}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_PLAN_MAX_INPUT_BYTES: ${AI_PLAN_MAX_INPUT_BYTES:-32768}
      AI_PLAN_MAX_OUTPUT_TOKENS: ${AI_PLAN_MAX_OUTPUT_TOKENS:-4096}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MAX_MONTHLY_CREDITS: ${TAVILY_MAX_MONTHLY_CREDITS:-1000}
      GOOGLE_CALENDAR_CREDENTIALS_FILE: /run/secrets/google-calendar.json
    volumes:
      - ${GOOGLE_CALENDAR_SECRET_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:?Set TELEGRAM_BOT_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
