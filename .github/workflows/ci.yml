name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Python, Rust, and full bot-to-Telegram path
        run: |
          unset DOCKER_HOST DOCKER_CONTEXT
          scripts/test-e2e.sh
